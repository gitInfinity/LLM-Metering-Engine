# Evaluator fields supplied by the assignment; endpoint entries describe each probe.
# Commands run from the repository root; test uses PowerShell syntax.
base_url: http://127.0.0.1:8000
run: uv run --env-file .env uvicorn src.api.app:app --host 127.0.0.1 --port 8000
seed: uv run --env-file .env -m src.db.seed
test: $env:RUN_DB_TESTS='1'; uv run --env-file .env -m unittest discover -s tests
endpoints:
  - method: GET
    path: /docs
    authentication: none
  - method: GET
    path: /openapi.json
    authentication: none
  - method: GET
    path: /usage
    authentication: tenant bearer API key
  - method: POST
    path: /generate
    authentication: tenant bearer API key
    headers:
      Idempotency-Key: unique-generation-key
      Content-Type: application/json
    body:
      prompt: Explain gravity
      usage:
        input_tokens: 100
        cached_input_tokens: 20
        output_tokens: 50
        reasoning_tokens: 10
  - method: POST
    path: /checkout
    authentication: tenant bearer API key
    headers:
      Idempotency-Key: unique-checkout-key
  - method: POST
    path: /stripe/webhook
    authentication: Stripe-Signature generated by Stripe CLI or Stripe
# Copy .env.example only when .env does not exist. Issue a tenant key via
# src.auth.cli; never put credentials in this manifest. Seed before DB tests.
